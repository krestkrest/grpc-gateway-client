version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/krestkrest/grpc-gateway-client-example
    except:
      - buf.build/googleapis/googleapis
      - buf.build/grpc-ecosystem/grpc-gateway

plugins:
  - plugin: go
    path: [ "../bin/protoc-gen-go" ]
    out: pkg/api/gen
    opt:
      - paths=source_relative
  - plugin: go-grpc
    path: [ "../bin/protoc-gen-go-grpc" ]
    out: pkg/api/gen
    opt:
      - paths=source_relative
  - plugin: grpc-gateway
    path: [ "../bin/protoc-gen-grpc-gateway" ]
    out: pkg/api/gen
    opt:
      - paths=source_relative
  - name: gateway-client
    path: protoc-gen-grpc-gateway-client
    out: pkg/api/gen
    opt:
      - paths=source_relative